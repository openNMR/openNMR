name: Release

# ONE workflow for a release. Push a version tag (packaging/release.py does
# this for you) and it
#
#   1. builds the desktop app on Windows, macOS (Apple silicon + Intel) and
#      Linux with packaging/build.py (PyInstaller) and checks it
#      (packaging/README.md: self-test from source, inside the frozen app,
#      compared pixel for pixel, then inside the *installed* copy);
#   2. wraps each in its installer:
#        Windows  openNMR-<ver>-windows-setup.exe   (Inno Setup; per-user, no admin)
#        macOS    openNMR-<ver>-macos-arm64.dmg / -macos-x86_64.dmg
#        Linux    openNMR-<ver>-linux-x86_64.AppImage
#   3. only if ALL four passed: publishes the wheel + sdist to PyPI (trusted
#      publishing, no token) and a GitHub Release with the installers and a
#      SHA256SUMS file -- which is what Settings > Updates looks for.
#
# Run by hand (Actions tab > Release > Run workflow) it builds and checks
# everything and uploads the installers as artifacts, but publishes nothing.
#
# No Actions minutes (private repositories get a monthly allowance; macOS
# jobs count 10x, Windows 2x)? Build and publish to PyPI from your own
# machine with packaging/release.py instead; this workflow is then only
# needed for the installers (public repositories run Actions free).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest        # Apple silicon (arm64)
            name: macos-arm64
          - os: macos-15-intel      # Intel; macos-13 was retired in Dec 2025
            name: macos-x86_64
          - os: ubuntu-22.04        # oldest supported glibc -> the AppImage runs on more distros
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version $v in pyproject.toml"; exit 1; }

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install openNMR and the build tools
        run: pip install -e ".[build]"

      - name: Build the app (PyInstaller)
        run: python packaging/build.py

      - name: Self-test from source
        run: python -m opennmr.selftest selftest-source

      - name: Self-test inside the built app (Linux)
        if: runner.os == 'Linux'
        run: dist/openNMR/openNMR --self-test selftest-app

      - name: Self-test inside the built app (macOS)
        if: runner.os == 'macOS'
        run: dist/openNMR.app/Contents/MacOS/openNMR --self-test selftest-app

      - name: Self-test inside the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed .exe does not block the shell: wait for it explicitly.
          $p = Start-Process -FilePath "dist\openNMR\openNMR.exe" -ArgumentList "--self-test","selftest-app" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content selftest-app\report.json; exit 1 }

      - name: Compare the built app with the source run
        run: python packaging/compare_selftest.py selftest-source selftest-app

      - name: Make the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          python packaging/make_installer.py

      - name: Make the installer (macOS)
        if: runner.os == 'macOS'
        run: python packaging/make_installer.py

      - name: Make the installer (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" python packaging/make_installer.py

      - name: Install it and self-test the installed copy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\openNMR-*-windows-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\openNMR\openNMR.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed at $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test","selftest-installed" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content selftest-installed\report.json; exit 1 }
          python packaging/compare_selftest.py selftest-source selftest-installed

      - name: Mount the DMG and self-test the app in it (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/openNMR-*-macos-*.dmg | head -1)
          mount=$(hdiutil attach "$dmg" -nobrowse | tail -1 | cut -f3-)
          "$mount/openNMR.app/Contents/MacOS/openNMR" --self-test selftest-installed
          hdiutil detach "$mount"
          python packaging/compare_selftest.py selftest-source selftest-installed

      - name: Run the AppImage's self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls dist/openNMR-*-linux-*.AppImage | head -1)
          "$appimage" --appimage-extract-and-run --self-test selftest-installed
          python packaging/compare_selftest.py selftest-source selftest-installed

      - name: Upload the self-test results (figures, window captures, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.name }}
          path: |
            selftest-*/*.png
            selftest-*/*.json
          if-no-files-found: ignore

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/openNMR-*-windows-setup.exe
            dist/openNMR-*.dmg
            dist/openNMR-*.AppImage
          if-no-files-found: error

  pypi:
    # The package for notebooks / pip install. Same gate as the release:
    # nothing is published unless every installer built and passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no PyPI token stored here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # packaging/release.py --publish may already have uploaded this
          # version from your own machine; that is fine, not an error.
          skip-existing: true

  release:
    # A GitHub Release with the installers: what Settings > Updates finds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Checksums (the in-app updater verifies each download against these)
        run: |
          cd installers
          sha256sum openNMR-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true