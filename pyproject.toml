[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennmr"
version = "0.6.0"
description = "Vendor-agnostic NMR import, processing, plotting, and GUI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Euan Bassey" }, { name = "Leo Gordon" }]  
keywords = ["NMR", "solid-state NMR", "spectroscopy", "fitting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy",
    "scipy>=1.15",  # scipy.integrate.lebedev_rule (Lebedev powder grids)
    "pandas",
    "matplotlib",
    "PySide6-Essentials",
    "sympy",
    "pymatgen",
]

[project.optional-dependencies]
# nmrglue is no longer a runtime dependency -- nothing in src/ imports
# it. It stays here because the reader/filter/window replacements are
# pinned by tests that compare against it byte-for-byte, which is the
# only reason those replacements can be trusted.
# pytest-xdist: run in parallel (pytest -n 8); pytest-timeout: a test that
# hangs fails after [tool.pytest.ini_options] timeout instead of freezing
# the run (2026-10-16).
test = ["pytest", "pytest-xdist", "pytest-timeout", "nmrglue", "pymatgen"]
# CIF-based pNMR simulation (notebook.pnmr_simulator, Simulate > pNMR (CIF)).
build = ["pyinstaller"]

[project.scripts]
opennmr-gui = "opennmr.gui.app:main"
opennmr-topspin-install = "opennmr.topspin.install:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"opennmr.gui" = ["resources/*.png", "resources/toolbar/*.png", "resources/*.dat"]
"opennmr.topspin" = ["resources/*.py"]

[tool.pytest.ini_options]
# Seconds before one test is stopped and reported as failed (pytest-timeout).
# Generous: the slowest real fits take a minute or two on a laptop.
timeout = 900
