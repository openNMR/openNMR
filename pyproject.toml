[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennmr"
version = "0.1.0"
description = "Vendor-agnostic NMR import, processing, plotting, and GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "nmrglue",
    "PySide6",
    "sympy",
]

[project.optional-dependencies]
test = ["pytest"]
build = ["pyinstaller"]

[project.scripts]
opennmr-gui = "opennmr.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"opennmr.gui" = ["resources/*.png"]
