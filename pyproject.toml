[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennmr"
version = "0.1.0"
description = "Vendor-agnostic NMR import, processing, plotting, and GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.15",  # scipy.integrate.lebedev_rule (Lebedev powder grids)
    "pandas",
    "matplotlib",
    "PySide6",
    "sympy",
]

[project.optional-dependencies]
# nmrglue is no longer a runtime dependency -- nothing in src/ imports
# it. It stays here because the reader/filter/window replacements are
# pinned by tests that compare against it byte-for-byte, which is the
# only reason those replacements can be trusted.
test = ["pytest", "nmrglue", "pymatgen"]
# CIF-based pNMR simulation (notebook.pnmr_simulator, Simulate > pNMR (CIF)).
pnmr = ["pymatgen"]
build = ["pyinstaller"]

[project.scripts]
opennmr-gui = "opennmr.gui.app:main"
opennmr-topspin-install = "opennmr.topspin.install:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"opennmr.gui" = ["resources/*.png", "resources/toolbar/*.png"]
"opennmr.topspin" = ["resources/*.py"]
